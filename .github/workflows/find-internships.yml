name: Find Internships

on:
  schedule:
    # Every 15 minutes -- GitHub's floor is 5 minutes, but that risks
    # exceeding a private repo's free 2,000 Actions-minutes/month budget.
    # 15 minutes is still close to real-time (there's no true "instant"
    # here since we're polling an external feed, not receiving a push) and
    # stays comfortably within budget. Runs can lag a little under
    # GitHub-wide load. Only fires once this workflow lives on the repo's
    # default branch — GitHub does not run `schedule` on other refs.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with mark-applied.yml and sync-checklist.yml -- all three commit
  # to data/tracked_jobs.json + APPLICATIONS.md, so they must never race on
  # git push.
  group: internship-tracker-state
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and filter internships
        id: fetch
        working-directory: scripts
        run: python fetch_internships.py

      - name: Create issues for new matches / close expired ones
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python create_issues.py

      - name: Text digest of new matches
        working-directory: scripts
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_SMS_GATEWAY: ${{ secrets.PHONE_SMS_GATEWAY }}
        run: python send_sms_digest.py

      - name: Commit tracker updates
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data APPLICATIONS.md
          git diff --cached --quiet || git commit -m "Update internship tracker (${{ steps.fetch.outputs.new_count }} new match(es))"
          git push
